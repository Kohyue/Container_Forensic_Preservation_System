# Local test environment: forensic-agent + a vulnerable target container.
# Falco runs on the HOST (not in Docker) — see README or run: make falco-install && make falco
#
# Usage:
#   make up              — start agent + target
#   make falco-install   — install Falco on the host (first time only)
#   make falco           — start Falco on the host (in a separate terminal)
#   docker exec -it target sh   — open shell in target to trigger alerts

services:
  # The forensic preservation agent
  forensic-agent:
    image: forensic-agent:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: forensic-agent
    restart: unless-stopped
    pid: host
    volumes:
      - ../configs/config.yaml:/etc/forensic-agent/config.yaml:ro
      - evidence:/var/forensics
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8765:8765"
      - "8080:8080"
    environment:
      - NODE_NAME=local

  # A minimal Alpine container used to simulate suspicious activity during testing.
  # Pre-installs netcat and curl so demo commands work out of the box.
  target:
    image: alpine:3.19
    container_name: target
    restart: unless-stopped
    command: >
      sh -c "apk add -q netcat-openbsd curl && sleep infinity"

volumes:
  evidence:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/forensics
