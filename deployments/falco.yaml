# Falco configuration for local docker-compose testing.
# Sends alerts as JSON webhooks to the forensic agent.

engine:
  kind: modern_ebpf

plugins:
  - name: container
    library_path: /usr/share/falco/plugins/libcontainer.so
    init_config:
      label_max_len: 100

load_plugins:
  - container

rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/forensic-rules.yaml

json_output: true
json_include_output_property: true
json_include_tags_property: true
log_stderr: true
log_syslog: false
log_level: info

# Send alerts to the forensic agent webhook
http_output:
  enabled: true
  url: "http://localhost:8765/alert"
  user_agent: "falcosecurity/falco"

# Also print to stdout for debugging
stdout_output:
  enabled: true
