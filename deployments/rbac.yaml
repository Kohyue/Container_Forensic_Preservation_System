---
apiVersion: v1
kind: Namespace
metadata:
  name: forensic-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forensic-agent
  namespace: forensic-system
---
# ClusterRole — read-only access to pod/node info for cross-referencing alerts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forensic-agent
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forensic-agent
subjects:
  - kind: ServiceAccount
    name: forensic-agent
    namespace: forensic-system
roleRef:
  kind: ClusterRole
  name: forensic-agent
  apiGroup: rbac.authorization.k8s.io
